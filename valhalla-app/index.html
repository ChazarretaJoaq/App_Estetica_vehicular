<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valhalla">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Valhalla · Estética vehicular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e10; --card:#18181b; --card2:#212125; --line:#2c2c31;
  --text:#f3f1ec; --muted:#9a978f; --gold:#d4af37; --gold2:#f0d77a; --goldDim:rgba(212,175,55,.14);
  --green:#4ade80; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa;
  --r:18px; --tab:68px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050506;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
@media (min-width:600px){
  body{padding:24px 0}
  .app{min-height:860px;height:860px;border-radius:38px;border:1px solid #2a2a2e;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
  .app .scroll{height:calc(860px - 64px - var(--tab))}
}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(12px + var(--st)) 18px 12px;background:linear-gradient(var(--bg) 70%,rgba(14,14,16,0))}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand svg{width:34px;height:34px}
.brand b{font-family:Cinzel,serif;letter-spacing:.18em;font-size:19px;color:var(--gold)}
.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:-2px}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.live{color:var(--green);border-color:rgba(74,222,128,.35)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:19px;height:19px;stroke:var(--text)}
.scroll{padding:4px 16px calc(var(--tab) + var(--sb) + 110px);overflow-y:auto}
.screen{display:none;animation:fade .25s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:24px;margin:6px 0 2px;font-weight:700}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
h2 a{color:var(--gold);text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer}
.sub{color:var(--muted);font-size:13px;margin:0 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .v{font-size:21px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.25}
.stat.gold{background:linear-gradient(145deg,#2a2412,#18181b);border-color:rgba(212,175,55,.35)}
.stat.gold .v{color:var(--gold2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.tap{cursor:pointer;transition:transform .1s}
.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;background:#f3f1ec;color:#111;padding:2px 6px;border-radius:5px;letter-spacing:.06em}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.chip.g{background:rgba(74,222,128,.13);color:var(--green)}
.chip.a{background:rgba(251,191,36,.13);color:var(--amber)}
.chip.r{background:rgba(248,113,113,.13);color:var(--red)}
.chip.b{background:rgba(96,165,250,.13);color:var(--blue)}
.chip.gold{background:var(--goldDim);color:var(--gold2)}
.progress{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--goldDim);color:var(--gold2);display:grid;place-items:center;font-weight:700;flex:none}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px;border:1px dashed var(--line);border-radius:var(--r)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{text-decoration:none;border:0;border-radius:14px;padding:13px 14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card2);color:var(--text);width:100%}
.btn svg{width:18px;height:18px}
.btn.gold{background:linear-gradient(135deg,var(--gold),#b8912a);color:#141108}
.btn.green{background:#1f8f4e;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--gold2)}
label.f{display:block;font-size:12px;color:var(--muted);margin:14px 4px 6px;font-weight:500}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;appearance:none}
.inp:focus{border-color:var(--gold)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=date].inp{color-scheme:dark}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.svc .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.svc.on{border-color:rgba(212,175,55,.6);background:linear-gradient(145deg,#231f12,var(--card))}
.svc.on .ck{background:var(--gold);border-color:var(--gold)}
.svc.on .ck::after{content:"";width:6px;height:11px;border:solid #141108;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.svc .d{text-align:right;font-size:13px}
.svc .d b{display:block;color:var(--gold2);font-size:15px}
.summary{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + var(--sb) + 8px);width:min(444px,calc(100% - 16px));background:rgba(28,26,20,.96);backdrop-filter:blur(12px);border:1px solid rgba(212,175,55,.4);border-radius:22px;padding:12px 14px;z-index:25;box-shadow:0 10px 40px rgba(0,0,0,.5);display:none}
.summary.on{display:block}
.summary .nums{display:grid;grid-template-columns:1fr 1.3fr 1.2fr;gap:6px;margin-bottom:10px}
.summary .nums div{font-size:11px;color:var(--muted)}
.summary .nums b{display:block;font-size:17px;color:var(--text)}
.summary .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(460px,100%);height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);background:rgba(14,14,16,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:30}
@media (min-width:600px){
  nav.tabs,.summary,.fab{position:absolute}
  nav.tabs{border-radius:0 0 38px 38px}
}
nav.tabs button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;cursor:pointer}
nav.tabs svg{width:23px;height:23px;stroke:currentColor}
nav.tabs button.on{color:var(--gold)}
nav.tabs button.mid span.ring{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--gold),#b8912a);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 20px rgba(212,175,55,.35)}
nav.tabs button.mid svg{stroke:#141108}
.fab{position:fixed;right:max(16px,calc(50% - 214px));bottom:calc(var(--tab) + var(--sb) + 16px);width:56px;height:56px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--gold),#b8912a);display:none;place-items:center;box-shadow:0 8px 24px rgba(212,175,55,.35);z-index:26;cursor:pointer}
.fab svg{width:26px;height:26px;stroke:#141108}
@media (min-width:600px){.fab{right:20px}}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.search .inp{padding-left:42px}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}
.calhead b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dn{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal .day{aspect-ratio:1/1.1;border-radius:12px;background:var(--card);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;cursor:pointer;font-size:14px;font-weight:600}
.cal .day.out{opacity:.28}
.cal .day.off{background:transparent;border-color:var(--line);color:var(--muted)}
.cal .day.today{border-color:var(--gold)}
.cal .day.sel{background:var(--gold);color:#141108}
.cal .day .dots{display:flex;gap:2px;height:6px}
.cal .day .dots i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.cal .day.l2 .dots i{background:var(--amber)}
.cal .day.l3 .dots i{background:var(--red)}
.cal .day.sel .dots i{background:#141108}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:10px 4px 0}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(460px,100%);max-height:88vh;max-height:88dvh;overflow-y:auto;background:#141416;border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;z-index:60;padding:10px 18px calc(24px + var(--sb));transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:20px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1}
.toast{position:fixed;left:50%;top:calc(16px + var(--st));transform:translate(-50%,-140%);background:#222;border:1px solid var(--line);padding:11px 16px;border-radius:14px;z-index:80;font-size:14px;font-weight:500;transition:transform .25s;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.toast.err{border-color:var(--red);color:var(--red)}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90;transition:opacity .3s}
.loader.hide{opacity:0;pointer-events:none}
.loader b{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.3em;font-size:22px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:10px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
a{color:var(--gold2)}
nav.tabs{grid-template-columns:repeat(var(--ntabs,5),1fr)}
.login{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 20%,#2a2412 0,var(--bg) 55%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px calc(24px) calc(24px + var(--sb))}
@media (min-width:600px){.login{position:absolute;border-radius:38px}}
.login.on{display:flex}
.login .box{width:100%;max-width:340px}
.login svg.logo{width:84px;height:84px;display:block;margin:0 auto 10px}
.login h1{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.25em;text-align:center;margin:0}
.login .sub{text-align:center;margin-bottom:18px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
.alert{display:flex;gap:12px;align-items:center;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);border-radius:var(--r);padding:12px 14px;margin-top:14px;cursor:pointer}
.alert b{color:var(--red)}
.stockbar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px}
.stockbar i{display:block;height:100%;border-radius:9px;background:var(--green)}
.stockbar.a i{background:var(--amber)}
.stockbar.r i{background:var(--red)}
.qty{font-size:20px;font-weight:700;text-align:right;line-height:1}
.qty small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--goldDim);color:var(--gold2);border-color:rgba(212,175,55,.45)}
.wa{width:40px;height:40px;border-radius:12px;background:#1f8f4e;display:grid;place-items:center;flex:none}
.wa svg{width:20px;height:20px;fill:#fff}
.imp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.imp input{width:20px;height:20px;accent-color:var(--gold)}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loader" id="loader"><b>VALHALLA</b></div>
  <div class="login" id="login">
    <div class="box">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d77a"/><stop offset="1" stop-color="#b8912a"/></linearGradient></defs><path d="M32 3 57 17v30L32 61 7 47V17z" fill="none" stroke="url(#lg2)" stroke-width="3"/><path d="M19 20h7l6 18 6-18h7L35 46h-6z" fill="url(#lg2)"/></svg>
      <h1>VALHALLA</h1><p class="sub">Estética vehicular</p>
      <form id="loginForm">
        <label class="f">Usuario</label><input class="inp" id="lU" autocomplete="username" autocapitalize="none" spellcheck="false">
        <label class="f">PIN</label><input class="inp" id="lP" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">
        <button class="btn gold" style="margin-top:18px" id="lBtn">Entrar</button>
      </form>
      <p class="hint" id="lHint"></p>
      <button class="btn ghost sm" style="margin:10px auto 0" id="lCfg">Ajustes de conexión</button>
    </div>
  </div>

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d77a"/><stop offset="1" stop-color="#b8912a"/></linearGradient></defs><path d="M32 3 57 17v30L32 61 7 47V17z" fill="none" stroke="url(#lg)" stroke-width="3"/><path d="M19 20h7l6 18 6-18h7L35 46h-6z" fill="url(#lg)"/></svg>
      <div><b>VALHALLA</b><small>Estética vehicular</small></div>
    </div>
    <span class="badge" id="modeBadge">DEMO</span>
    <button class="iconbtn" id="btnSettings" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <main class="scroll" id="scroll">
    <section class="screen" id="s-home"></section>
    <section class="screen" id="s-cotizar"></section>
    <section class="screen" id="s-agenda"></section>
    <section class="screen" id="s-clientes"></section>
    <section class="screen" id="s-trabajos"></section>
    <section class="screen" id="s-admin"></section>
  </main>

  <div class="summary" id="summary"></div>
  <button class="fab" id="fab" aria-label="Agregar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabs" id="tabs">
    <button data-s="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button data-s="agenda"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Agenda</button>
    <button data-s="cotizar" class="mid"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5"/></svg></span>Cotizar</button>
    <button data-s="clientes"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg>Clientes</button>
    <button data-s="trabajos"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2M8.5 13.5l2.5 2.5 4.5-5"/></svg>Trabajos</button>
    <button data-s="admin" id="tabAdmin" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10v-6z"/><path d="M9 12l2 2 4-4"/></svg>Admin</button>
  </nav>
</div>

async function post(action, payload) {

  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'Error de la API'); e.auth = /PIN|usuario/i.test(j.error || ''); throw e; }
  return j;
}

/* ---------------- cálculos (misma lógica que el Sheet) ---------------- */
const svc = name => DB.servicios.find(s => s.nombre === name);
const modelo = name => DB.modelos.find(m => m.vehiculo === name);
const veh = pat => DB.vehiculos.find(v => v.patente === pat);
const cli = id => DB.clientes.find(c => c.id === id);
const factors = vehiculo => { const m = modelo(vehiculo); return { ft: m ? Number(m.ft) || 1 : 1, fp: m ? Number(m.fp) || 1 : 1 }; };
const estDias = (serv, ft) => { const s = svc(serv); return s ? Math.ceil(Number(s.dias) * ft * 2) / 2 : 0; };
const estPrecio = (serv, fp) => { const s = svc(serv); return s ? Number(s.precio) * fp : 0; };
const isWork = s => DB.params.pattern[(parse(s).getDay() + 6) % 7] === '0' && !DB.params.feriados.includes(s);
function workday(start, n) { let d = start; let guard = 0; while (!isWork(d) && guard++ < 30) d = plusDays(d, 1); let k = 0; while (k < n) { d = plusDays(d, 1); if (isWork(d)) k++; } return d; }
function netdays(a, b) { let n = 0, d = a, g = 0; while (d <= b && g++ < 400) { if (isWork(d)) n++; d = plusDays(d, 1); } return n; }
function nextWorkday() { let d = plusDays(today(), 1); while (!isWork(d)) d = plusDays(d, 1); return d; }
function presu(n) {
  const lines = DB.presupuestos.filter(p => p.n === n);
  if (!lines.length) return null;
  const v = veh(lines[0].patente) || {}; const f = factors(v.vehiculo); const c = cli(v.idCliente) || {};
  const dias = lines.reduce((a, l) => a + estDias(l.servicio, f.ft), 0);
  const precio = lines.reduce((a, l) => a + estPrecio(l.servicio, f.fp), 0);
  return { n, fecha: lines[0].fecha, estado: lines[0].estado, patente: lines[0].patente, servicios: lines.map(l => l.servicio), veh: v, cli: c, f, dias, precio };
}
function turnoInfo(t) {
  const p = presu(t.n) || { dias: 0, servicios: [], veh: {}, cli: {}, precio: 0, f: { ft: 1, fp: 1 } };
  const habiles = Math.ceil(p.dias);
  const entrega = habiles ? workday(t.ingreso, habiles - 1) : t.ingreso;
  return Object.assign({}, t, { p, habiles, entrega });
}
const activos = () => DB.turnos.filter(t => t.estado !== 'Cancelado' && t.estado !== 'Entregado').map(turnoInfo);
const carsOn = d => activos().filter(t => t.ingreso <= d && t.entrega >= d);
const estadoChip = e => ({ 'Agendado': 'a', 'En proceso': 'b', 'Terminado': 'g', 'Entregado': '', 'Cancelado': 'r', 'Aprobado': 'g', 'Pendiente': 'a', 'Rechazado': 'r' }[e] ?? '');
function waLink(phone, text) {
  let d = String(phone || '').replace(/\D/g, '');
  if (d && !d.startsWith('54')) d = '549' + d.replace(/^0/, '');
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text);
}

  const h = new Date().getHours();

function quote() {

/* ---------------- AGENDA ---------------- */
const A = { month: today().slice(0, 7), sel: today() };
function renderAgenda() {
  const [y, m] = A.month.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const cap = DB.params.capacidad; const hoy = today();
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const s = iso(d);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    const n = carsOn(s).length; const lvl = n === 0 ? '' : n >= cap ? 'l3' : n >= cap - 1 ? 'l2' : 'l1';
    cells += `<div class="day ${d.getMonth() !== m - 1 ? 'out' : ''} ${isWork(s) ? '' : 'off'} ${s === hoy ? 'today' : ''} ${s === A.sel ? 'sel' : ''} ${lvl}" data-d="${s}"><span>${d.getDate()}</span><span class="dots">${'<i></i>'.repeat(Math.min(n, 4))}</span></div>`;
  }
  const list = carsOn(A.sel);
  const sinTurno = [...new Set(DB.presupuestos.filter(p => p.estado !== 'Rechazado' && p.estado !== 'Vencido').map(p => p.n))].filter(n => !DB.turnos.some(t => t.n === n && t.estado !== 'Cancelado'));
  $('#s-agenda').innerHTML = `
    <h1>Agenda</h1><p class="sub">Ocupación del taller · capacidad ${cap} autos</p>
    <div class="calhead"><button class="iconbtn" id="aPrev"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b>${cap1(first.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }))}</b>
      <button class="iconbtn" id="aNext"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
    <div class="cal">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(x => `<div class="dn">${x}</div>`).join('')}${cells}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>Con lugar</span><span><i style="background:var(--amber)"></i>Casi lleno</span><span><i style="background:var(--red)"></i>Lleno</span></div>
    <h2>${fmtDL(A.sel)} · ${list.length} ${list.length === 1 ? 'auto' : 'autos'}</h2>
    ${list.length ? list.map(turnoCard).join('') : '<div class="empty">Taller libre ese día</div>'}
    <h2>Por agendar</h2>
    ${sinTurno.length ? sinTurno.map(presu).map(presuCard).join('') : '<div class="empty">Todos los presupuestos tienen turno</div>'}
  `;
  const shift = k => { const d = new Date(y, m - 1 + k, 1); A.month = iso(d).slice(0, 7); renderAgenda(); };
  $('#aPrev').onclick = () => shift(-1); $('#aNext').onclick = () => shift(1);
  document.querySelectorAll('#s-agenda .day').forEach(el => el.onclick = () => { A.sel = el.dataset.d; renderAgenda(); });
}

/* ---------------- TRABAJOS ---------------- */
let trFilter = 'mes';
function trabajoCard(t) {
  const v = veh(t.patente) || {}; const c = cli(v.idCliente) || {};
  const est = estDias(t.servicio, factors(v.vehiculo).ft); const real = netdays(t.inicio, t.fin); const dv = real - est;
  const chip = dv > 0 ? `<span class="chip r">+${String(dv).replace('.', ',')} d</span>` : dv < 0 ? `<span class="chip g">${String(dv).replace('.', ',')} d</span>` : '<span class="chip">a tiempo</span>';
  return `<div class="card"><div class="row"><div class="grow"><div class="t1">${esc(t.servicio)}</div><div class="t2">${esc(v.vehiculo || '')} · ${esc(c.nombre || '')}</div></div><b>${money(t.precio)}</b></div>
    <div class="row" style="margin-top:8px;font-size:12px;color:var(--muted)"><div class="grow">${fmtD(t.inicio)} → ${fmtD(t.fin)} · ${real} ${real === 1 ? 'día' : 'días'} (est. ${String(est).replace('.', ',')})</div>${chip}</div></div>`;
}
function renderTrabajos() {
  const hoy = today(); const mesIni = hoy.slice(0, 8) + '01';
  const list = DB.trabajos.filter(t => trFilter === 'todos' || t.fin >= mesIni).sort((a, b) => b.fin.localeCompare(a.fin));
  const total = list.reduce((a, t) => a + Number(t.precio || 0), 0);
  const prom = list.length ? list.reduce((a, t) => { const v = veh(t.patente) || {}; return a + netdays(t.inicio, t.fin) - estDias(t.servicio, factors(v.vehiculo).ft); }, 0) / list.length : 0;
  $('#s-trabajos').innerHTML = `
    <h1>Trabajos</h1><p class="sub">Realizados, con días reales vs. estimados</p>
    <div class="seg" style="margin-top:12px"><button data-f="mes" class="${trFilter === 'mes' ? 'on' : ''}">Este mes</button><button data-f="todos" class="${trFilter === 'todos' ? 'on' : ''}">Todos</button></div>
    <div class="stats"><div class="stat"><div class="v">${list.length}</div><div class="l">trabajos</div></div><div class="stat gold"><div class="v" style="font-size:15px;padding-top:3px">${money(total)}</div><div class="l">facturado</div></div><div class="stat"><div class="v">${prom > 0 ? '+' : ''}${(Math.round(prom * 10) / 10).toString().replace('.', ',')}</div><div class="l">desvío prom. (días)</div></div></div>
    <h2>Historial</h2>
    ${list.length ? list.map(trabajoCard).join('') : '<div class="empty">Sin trabajos en este período</div>'}
  `;
  document.querySelectorAll('#s-trabajos .seg button').forEach(b => b.onclick = () => { trFilter = b.dataset.f; renderTrabajos(); });
}

function stockDe(p) {
  const mov = DB.movimientos.filter(m => m.codigo === p.codigo);
  const ent = mov.filter(m => m.tipo === 'Entrada').reduce((a, m) => a + Number(m.cantidad || 0), 0);
  const sal = mov.filter(m => m.tipo === 'Salida').reduce((a, m) => a + Number(m.cantidad || 0), 0);
  const stock = Number(p.inicial || 0) + ent - sal;
  const estado = stock <= 0 ? 'Sin stock' : stock <= Number(p.minimo || 0) ? 'Reponer' : 'OK';
  return { stock, estado, valor: stock * Number(p.costo || 0), mov };
}
const bajos = () => DB.productos.filter(p => stockDe(p).estado !== 'OK');

    el.querySelector('#pOk').onclick = async e => {
      const d = { nombre: $('#pN').value.trim(), categoria: $('#pC').value, unidad: $('#pU').value, minimo: Number($('#pM').value) || 0, costo: Number($('#pK').value) || 0, proveedor: $('#pP').value.trim() };
      if (!d.nombre) return toast('Falta el nombre', true);
      if (codigo) { await run(e.currentTarget, () => api('updateProducto', Object.assign({ codigo }, d))); toast('Producto actualizado ✓'); render(); sheetProducto(codigo); }
      else { d.inicial = Number($('#pI').value) || 0; const r = await run(e.currentTarget, () => api('addProducto', d)); toast('Producto creado ✓'); render(); sheetProducto(r.codigo); }
    };
  });
}
function agenda() {
  const cont = DB.contactos.map(c => Object.assign({ src: 'k' }, c));
  const clis = DB.clientes.map(c => ({ src: 'c', id: c.id, nombre: c.nombre, tipo: 'Cliente', telefono: c.telefono, email: c.email, empresa: '', notas: c.notas }));
  return cont.concat(clis).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre)));
}
function renderContactos() {
  const all = agenda(); const q = AD.q.toLowerCase();
  const tipos = ['Todos', ...new Set(['Proveedor', 'Cliente', ...DB.params.tiposContacto])];
  const list = all.filter(c => (AD.ctipo === 'Todos' || c.tipo === AD.ctipo) && (!q || [c.nombre, c.empresa, c.telefono, c.email, c.notas].join(' ').toLowerCase().includes(q)));
  $('#adBody').innerHTML = `
    ${searchBox('Buscar nombre, empresa o teléfono')}
    <div class="chips">${tipos.map(t => `<button data-t="${esc(t)}" class="${AD.ctipo === t ? 'on' : ''}">${esc(t)} (${t === 'Todos' ? all.length : all.filter(c => c.tipo === t).length})</button>`).join('')}</div>
    <div class="quick"><label class="btn" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Importar del celular<input type="file" id="vcfIn" accept=".vcf,text/vcard,text/x-vcard" hidden></label><button class="btn" id="vcfOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>Exportar .vcf</button></div>
    <h2>${list.length} contactos</h2>
    ${list.length ? list.map(c => `<div class="card"><div class="row"><div class="avatar tap" onclick="${c.src === 'c' ? `sheetCliente('${esc(c.id)}')` : `sheetContacto('${esc(c.id)}')`}">${esc(initials(c.nombre))}</div>
      <div class="grow tap" onclick="${c.src === 'c' ? `sheetCliente('${esc(c.id)}')` : `sheetContacto('${esc(c.id)}')`}"><div class="t1">${esc(c.nombre)}</div><div class="t2">${esc(c.tipo)}${c.empresa && c.empresa !== c.nombre ? ' · ' + esc(c.empresa) : ''} · ${esc(c.telefono || 'sin teléfono')}</div></div>
      ${c.telefono ? `<a class="wa" href="${waLink(c.telefono, 'Hola ' + String(c.nombre).split(' ')[0] + '! Te escribo de Valhalla.')}" target="_blank" rel="noopener" aria-label="WhatsApp">${WA_ICON}</a>` : ''}</div></div>`).join('') : '<div class="empty">Sin contactos</div>'}
  `;
  bindSearch(renderContactos);
  document.querySelectorAll('#adBody .chips button').forEach(b => b.onclick = () => { AD.ctipo = b.dataset.t; renderContactos(); });
  $('#vcfIn').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => sheetImportar(parseVcf(String(r.result))); r.readAsText(f); e.target.value = ''; };
  $('#vcfOut').onclick = exportVcf;
}
function sheetContacto(id) {
  const c = DB.contactos.find(x => x.id === id);
  openSheet(`
    <div class="row"><div class="avatar" style="width:52px;height:52px;font-size:18px">${esc(initials(c.nombre))}</div><div class="grow"><h3>${esc(c.nombre)}</h3><p class="sub">${esc(c.tipo || '')}${c.empresa ? ' · ' + esc(c.empresa) : ''}</p></div></div>
    <div class="kv"><span>Teléfono</span><b>${esc(c.telefono || '—')}</b></div>
    ${c.email ? `<div class="kv"><span>Email</span><b>${esc(c.email)}</b></div>` : ''}
    ${c.notas ? `<div class="kv"><span>Notas</span><b style="text-align:right">${esc(c.notas)}</b></div>` : ''}
    <div class="btnrow">${c.telefono ? `<a class="btn green" href="${waLink(c.telefono, 'Hola ' + String(c.nombre).split(' ')[0] + '! Te escribo de Valhalla.')}" target="_blank" rel="noopener">WhatsApp</a><a class="btn" href="tel:${esc(String(c.telefono).replace(/\s/g, ''))}">Llamar</a>` : ''}</div>
    <div class="btnrow"><button class="btn ghost" onclick="sheetContactoForm('${esc(id)}')">Editar contacto</button></div>
    ${c.tipo === 'Proveedor' ? `<h2>Productos que provee</h2>${DB.productos.filter(p => proveedorContacto(p.proveedor) === c).map(p => `<div class="kv tap" onclick="sheetProducto('${esc(p.codigo)}')"><span>${esc(p.nombre)}</span><b>${num(stockDe(p).stock)} ${esc(p.unidad || '')}</b></div>`).join('') || '<div class="empty">Ningún producto vinculado</div>'}` : ''}
  `);
}
function sheetContactoForm(id) {
  const c = id ? DB.contactos.find(x => x.id === id) : { tipo: 'Proveedor' };
  openSheet(`
    <h3>${id ? 'Editar contacto' : 'Nuevo contacto'}</h3><p class="sub">${id ? esc(id) : 'Se guarda en la hoja Contactos'}</p>
    <label class="f">Nombre *</label><input class="inp" id="kN" value="${esc(c.nombre || '')}">
    <div class="grid2"><div><label class="f">Tipo</label><select class="inp" id="kT">${DB.params.tiposContacto.filter(t => t !== 'Cliente').map(t => `<option ${t === c.tipo ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div><div><label class="f">Teléfono</label><input class="inp" id="kP" type="tel" value="${esc(c.telefono || '')}"></div></div>
    <label class="f">Empresa</label><input class="inp" id="kE" value="${esc(c.empresa || '')}">
    <label class="f">Email</label><input class="inp" id="kM" type="email" value="${esc(c.email || '')}">
    <label class="f">Notas</label><input class="inp" id="kO" value="${esc(c.notas || '')}">
    <p class="note">Los clientes se cargan desde la pestaña Clientes, con su vehículo.</p>
    <div class="btnrow"><button class="btn ghost" onclick="${id ? `sheetContacto('${esc(id)}')` : 'closeSheet()'}">Cancelar</button><button class="btn gold" id="kOk">Guardar</button></div>
  `, el => {
    el.querySelector('#kOk').onclick = async e => {
      const d = { nombre: $('#kN').value.trim(), tipo: $('#kT').value, telefono: $('#kP').value.trim(), empresa: $('#kE').value.trim(), email: $('#kM').value.trim(), notas: $('#kO').value.trim() };
      if (!d.nombre) return toast('Falta el nombre', true);
      const r = await run(e.currentTarget, () => api(id ? 'updateContacto' : 'addContacto', id ? Object.assign({ id }, d) : d));
      toast('Contacto guardado ✓'); render(); sheetContacto(id || r.id);
    };
  });
}
/* --- vCard: importar desde el celular / exportar para el celular --- */
function parseVcf(txt) {
  const out = [];
  txt.replace(/\r\n|\r/g, '\n').replace(/\n[ \t]/g, '').split(/BEGIN:VCARD/i).slice(1).forEach(block => {
    const get = re => { const m = block.match(re); return m ? m[1].trim() : ''; };
    let nombre = get(/^FN[^:\n]*:(.*)$/im);
    if (!nombre) { const n = get(/^N[;:][^:\n]*:?(.*)$/im) || get(/^N:(.*)$/im); nombre = n.split(';').slice(0, 2).reverse().join(' ').trim(); }
    const telefono = get(/^(?:item\d+\.)?TEL[^:\n]*:(.*)$/im);
    const email = get(/^(?:item\d+\.)?EMAIL[^:\n]*:(.*)$/im);
    const empresa = get(/^ORG[^:\n]*:(.*)$/im).split(';')[0];
    const unq = s => s.replace(/\\,/g, ',').replace(/\;/g, ';').replace(/\\n/gi, ' ');
    if (nombre || telefono) out.push({ nombre: unq(nombre || telefono), telefono: unq(telefono), email: unq(email), empresa: unq(empresa) });
  });
  return out;
}
function sheetImportar(items) {
  const known = new Set(agenda().map(c => String(c.telefono || '').replace(/\D/g, '').slice(-8)).filter(Boolean));
  const rows = items.map(it => Object.assign({ dup: !!it.telefono && known.has(it.telefono.replace(/\D/g, '').slice(-8)) }, it));
  if (!rows.length) return toast('No encontré contactos en ese archivo', true);
  openSheet(`
    <h3>Importar contactos</h3><p class="sub">${rows.length} en el archivo · ${rows.filter(r => r.dup).length} ya están en la agenda</p>
    <label class="f">Guardar como</label><select class="inp" id="iT">${DB.params.tiposContacto.filter(t => t !== 'Cliente').map(t => `<option>${esc(t)}</option>`).join('')}</select>
    <div style="margin-top:10px">${rows.map((r, i) => `<label class="imp"><input type="checkbox" data-i="${i}" ${r.dup ? '' : 'checked'}><div class="grow"><div class="t1">${esc(r.nombre)}</div><div class="t2">${esc(r.telefono || 'sin teléfono')}${r.empresa ? ' · ' + esc(r.empresa) : ''}${r.dup ? ' · <span style="color:var(--amber)">ya existe</span>' : ''}</div></div></label>`).join('')}</div>
    <div class="btnrow"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn gold" id="iOk">Importar seleccionados</button></div>
  `, el => {
    el.querySelector('#iOk').onclick = async e => {
      const tipo = $('#iT').value;
      const sel = [...el.querySelectorAll('input[type=checkbox]:checked')].map(c => Object.assign({ tipo, notas: 'Importado del celular' }, rows[+c.dataset.i]));
      sel.forEach(s => delete s.dup);
      if (!sel.length) return toast('No seleccionaste ninguno', true);
      const r = await run(e.currentTarget, () => api('importContactos', { items: sel }));
      closeSheet(); toast((r && r.importados) + ' contactos importados ✓'); render();
    };
  });
}
function exportVcf() {
  const v = s => String(s || '').replace(/([,;\\])/g, '\\$1');
  const txt = agenda().map(c => ['BEGIN:VCARD', 'VERSION:3.0', 'FN:' + v(c.nombre), c.telefono ? 'TEL;TYPE=CELL:' + c.telefono : '', c.email ? 'EMAIL:' + c.email : '',
    'ORG:' + v(c.empresa || 'Valhalla'), 'NOTE:' + v('Valhalla · ' + c.tipo), 'END:VCARD'].filter(Boolean).join('\r\n')).join('\r\n');
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'text/vcard' }));
    a.download = 'contactos-valhalla.vcf';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Archivo listo: abrilo en el celular para agregar los contactos');
  } catch (e) { toast('No se pudo descargar el archivo en este navegador', true); }
}

/* ---------------- AJUSTES ---------------- */
$('#btnSettings').onclick = () => {
  openSheet(`
    <h3>Ajustes</h3><p class="sub">Modo actual: <b>${live() ? 'conectado al Google Sheet' : 'demo (datos de prueba)'}</b></p>
    ${session ? `<div class="card row"><div class="avatar">${esc(initials(session.nombre || session.usuario))}</div><div class="grow"><div class="t1">${esc(session.nombre || session.usuario)}</div><div class="t2">Usuario ${esc(session.usuario)} · ${isAdmin() ? 'Administrador' : 'Operador'}</div></div><button class="btn sm ghost" onclick="logout()">Salir</button></div>` : ''}
    <label class="f">URL del Apps Script (termina en /exec)</label><input class="inp mono" id="sU" value="${esc(cfg.API_URL || '')}" placeholder="https://script.google.com/macros/s/…/exec">
    <div class="btnrow"><button class="btn gold" id="sOk">Guardar y conectar</button></div>
    <div class="btnrow"><button class="btn ghost" id="sDemo">Usar modo demo</button><button class="btn ghost" id="sReset">Reiniciar datos demo</button></div>
    <p class="note">En modo demo los cambios quedan solo en este navegador. Conectada al Sheet, todo se lee y se guarda en la planilla de Valhalla.</p>
  `, el => {
    el.querySelector('#sOk').onclick = async () => { const u = $('#sU').value.trim(); if (u !== cfg.API_URL) { session = null; store.del('valhalla.session'); } cfg = { API_URL: u }; store.set('valhalla.cfg', cfg); closeSheet(); await boot(); };
    el.querySelector('#sDemo').onclick = async () => { if (cfg.API_URL) { session = null; store.del('valhalla.session'); } cfg = { API_URL: '' }; store.set('valhalla.cfg', cfg); closeSheet(); await boot(); };
    el.querySelector('#sReset').onclick = async () => { store.del('valhalla.demo'); if (!live()) await boot(); closeSheet(); toast('Datos demo reiniciados'); };
  });
};

/* ---------------- arranque ---------------- */
function showLogin() {
  $('#loader').classList.add('hide');
  $('#login').classList.add('on');
  $('#lHint').innerHTML = live() ? 'Conectado a la planilla de Valhalla' : 'Modo demo · probá con <b>admin</b> / 1234 o <b>operador</b> / 0000';
  $('#lP').value = '';
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#lBtn'); btn.disabled = true; btn.textContent = 'Entrando…';
  try { await login($('#lU').value, $('#lP').value); $('#login').classList.remove('on'); current = 'home'; await boot(); }
  catch (er) { toast(er.message, true); }
  finally { btn.disabled = false; btn.textContent = 'Entrar'; }
};
$('#lCfg').onclick = () => $('#btnSettings').onclick();
async function boot() {
  const b = $('#modeBadge'); b.textContent = live() ? 'EN VIVO' : 'DEMO'; b.className = 'badge' + (live() ? ' live' : '');
  if (!session) return showLogin();
  $('#loader').classList.remove('hide');
  try { await load(); }
  catch (e) {
    if (e.auth) { toast(e.message, true); return logout(); }
    toast('No se pudo conectar: ' + e.message, true); return showLogin();
  }
  $('#tabAdmin').style.display = isAdmin() ? '' : 'none';
  $('#tabs').style.setProperty('--ntabs', isAdmin() ? 6 : 5);
  if (current === 'admin' && !isAdmin()) current = 'home';
  $('#loader').classList.add('hide');
  go(current);
}
boot();
